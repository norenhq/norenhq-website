<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Noren</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <div class="bar-top">
    <a href="index.html" class="bar-link">← Back</a>
    <div>Contact · Noren</div>
  </div>

  <div class="masthead">
    <div class="wordmark">Noren<span class="dot"></span></div>
    <div class="strapline">tell us what's broken</div>
  </div>

  <div class="section">
    <div class="eyebrow-center">— Send a brief</div>
    <h2 class="section-heading">A short note. We'll reply within <em>48 hours.</em></h2>

    <form class="form" action="mailto:hello@norenhq.io" method="POST" enctype="text/plain">

      <div class="form-row">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-field">
          <label for="company">Company</label>
          <input type="text" id="company" name="company">
        </div>
        <div class="form-field">
          <label for="url">Product URL</label>
          <input type="url" id="url" name="url" placeholder="https://">
        </div>
      </div>

      <div class="form-field">
        <label for="built">What did you build?</label>
        <textarea id="built" name="built" rows="3" required></textarea>
      </div>

      <div class="form-field">
        <label for="broken">What feels broken or messy right now?</label>
        <textarea id="broken" name="broken" rows="4" required></textarea>
      </div>

      <div class="form-footer">
        <div class="form-tagline">Fixed scope. Fixed fee. No equity. No retainers.</div>
        <button type="submit" class="form-submit">Request MVP teardown →</button>
      </div>
    </form>

    <p class="cta-alt" style="text-align: center;">Or email us directly at <a href="mailto:hello@norenhq.io">hello@norenhq.io</a></p>
  </div>

  <div class="bar-bottom">
    <div>© Noren 2026 · hello@norenhq.io</div>
    <div>Sydney · Worldwide</div>
  </div>

</div>

<script src="form.js"></script>
</body>
</html>
